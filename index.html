<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doce Encanto</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div class="box">

        <h1>🍰 Doce Encanto</h1>

        <input
            id="usuario"
            placeholder="Usuário"
        >

        <input
            id="senha"
            type="password"
            placeholder="Senha"
        >

        <button
            id="login-btn"
            onclick="login()"
        >
            Entrar
        </button>

        <p id="erro"></p>

        <small>
            Usuário: admin | Senha: 1234
        </small>

    </div>

</div>


<!-- LOJA -->

<div id="loja">

    <header>

        <h1>🍰 Doce Encanto</h1>

        <button
            id="carrinho-btn"
            onclick="abrirCarrinho()"
        >
            🛒 Carrinho (<span id="qtd">0</span>)
        </button>

    </header>


    <main>

        <!-- PRODUTOS -->

        <section id="produtos">

            <h2>Nossos Doces</h2>

            <div class="produtos">

                <div class="produto">

                    <div class="foto">🍰</div>

                    <h3>Bolo de Chocolate</h3>

                    <p>R$ 35,00</p>

                    <button
                        id="bolo"
                        onclick="adicionar(1)"
                    >
                        Adicionar
                    </button>

                </div>


                <div class="produto">

                    <div class="foto">🧁</div>

                    <h3>Cupcake</h3>

                    <p>R$ 8,00</p>

                    <button
                        id="cupcake"
                        onclick="adicionar(2)"
                    >
                        Adicionar
                    </button>

                </div>


                <div class="produto">

                    <div class="foto">🍪</div>

                    <h3>Cookie</h3>

                    <p>R$ 6,00</p>

                    <button
                        id="cookie"
                        onclick="adicionar(3)"
                    >
                        Adicionar
                    </button>

                </div>

            </div>

        </section>


        <!-- CARRINHO -->

        <section id="carrinho">

            <h2>🛒 Meu Carrinho</h2>

            <div id="itens"></div>

            <h3 id="total">
                Total: R$ 0,00
            </h3>

            <button onclick="abrirProdutos()">
                Continuar comprando
            </button>

            <button
                id="checkout"
                onclick="checkout()"
            >
                Finalizar pedido
            </button>

        </section>


        <!-- CHECKOUT -->

        <section id="finalizar">

            <h2>💳 Finalizar Pedido</h2>

            <input
                id="nome"
                placeholder="Nome"
            >

            <input
                id="endereco"
                placeholder="Endereço"
            >

            <input
                id="telefone"
                placeholder="Telefone"
            >

            <button
                id="finalizar-btn"
                onclick="finalizar()"
            >
                Confirmar pedido
            </button>

        </section>


        <!-- SUCESSO -->

        <section id="sucesso">

            <h1>✅ Pedido realizado!</h1>

            <p id="mensagem"></p>

            <button onclick="novaCompra()">
                Nova compra
            </button>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
